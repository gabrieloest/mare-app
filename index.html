<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Maré — Ciclo, Libido & Bem-Estar Íntimo</title>
  <meta name="description" content="Rastreador privado de ciclo menstrual, libido e bem-estar íntimo. Mapeie suas ondas hormonais com total privacidade." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maré" />

  <style>
    :root {
      --bg: #0f172a;
      --bg-elevated: #1e293b;
      --bg-card: #162033;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.16);
      --accent-hover: #059669;
      --menstrual: #f43f5e;
      --follicular: #38bdf8;
      --ovulatory: #10b981;
      --luteal: #a78bfa;
      --warning: #f59e0b;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: calc(84px + var(--safe-bottom));
    }

    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 24px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 18px;
      position: sticky;
      top: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: grid;
      place-items: center;
      color: var(--accent);
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
      margin-top: -2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-pill {
      background: var(--bg-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-pill.accent {
      background: var(--accent);
      color: #042f2e;
      border-color: var(--accent);
    }

    .btn-pill.warn {
      background: rgba(245, 158, 11, 0.16);
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.45);
    }

    .btn-pill:active {
      transform: scale(0.96);
    }

    /* Views */
    .view {
      display: none;
      animation: fadeIn 0.22s ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      white-space: nowrap;
    }

    /* Cycle Ring & Status */
    .wave-hero {
      background: linear-gradient(145deg, #162238 0%, #0f172a 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 16px;
      margin-bottom: 16px;
    }

    .wave-grid {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 16px;
      align-items: center;
    }

    .cycle-ring {
      width: 112px;
      height: 112px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .cycle-ring svg {
      transform: rotate(-90deg);
      width: 112px;
      height: 112px;
    }

    .cycle-ring-center {
      position: absolute;
      text-align: center;
    }

    .cycle-day-num {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .cycle-day-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .phase-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .phase-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .prediction-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pred-pill {
      font-size: 0.74rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 4px 8px;
      border-radius: 8px;
      color: var(--text);
    }

    /* Quick Libido Check-in */
    .libido-scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 10px 0 14px;
    }

    .libido-btn {
      background: var(--bg-elevated);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 4px;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: 0.18s;
    }

    .libido-btn .lvl {
      font-size: 1.15rem;
      font-weight: 800;
      display: block;
    }

    .libido-btn .lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .libido-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .libido-btn.selected .lbl {
      color: var(--text);
    }

    /* Chips / Tags */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .chip {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 0.15s;
      user-select: none;
    }

    .chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    .chip.menstrual.active {
      background: rgba(244, 63, 94, 0.18);
      border-color: var(--menstrual);
      color: #fecdd3;
    }

    /* Form Controls */
    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select, input[type="text"], input[type="password"], input[type="date"], input[type="number"], textarea {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #042f2e;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Duo Mode Specifics */
    .climate-banner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.16), rgba(56, 189, 248, 0.12));
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .signal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .signal-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      background: var(--bg-elevated);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 600;
      transition: 0.18s;
    }

    .signal-btn small {
      display: block;
      font-size: 0.73rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .signal-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.84rem;
    }

    .toggle-row:last-child {
      border-bottom: none;
    }

    .plan-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    /* Calendar */
    .cal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .cal-grid {
      display: grid;
